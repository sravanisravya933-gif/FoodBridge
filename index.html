<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodBridge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Welcome to FoodBridge</h1>
    <p>Connecting surplus food to people in need.</p>

    <div class="donation-form">
        <h2>Donate Surplus Food</h2>

        <form>
            <label>Donor Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required>

            <label>Food Details</label>
            <input type="text" placeholder="Example: Rice, curry" required>

            <label>Food Quantity</label>
            <input type="text" placeholder="Example: 20 meals" required>

            <label>Pickup Location</label>
            <input type="text" placeholder="Enter location" required>

            <button type="submit">Submit Donation</button>
        </form>
    </div>

</body>
</html>
